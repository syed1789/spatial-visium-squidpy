name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint shell and sbatch scripts
        run: shellcheck -S warning run_analysis.sh aws/launch_ec2.sh hpc/submit_slurm.sbatch

  dry-run:
    name: run_analysis.sh dry run (docker and apptainer)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: DRY_RUN=1 ./run_analysis.sh run
      - run: RUNTIME=apptainer DRY_RUN=1 ./run_analysis.sh run
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Compile Python scripts
        run: python -m compileall -q analyze_visium.py

  docker-build:
    name: docker image builds and imports
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t spatial-visium-squidpy .
      - run: docker run --rm spatial-visium-squidpy python -c "import scanpy, squidpy; print('ok')"
